services:
  mysql:
    image: mysql:8.0
    container_name: fantasy-league-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wkApp
    ports:
      - "3306:3306"
    volumes:
      - fantasy-league-db:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fantasy-league-db:
